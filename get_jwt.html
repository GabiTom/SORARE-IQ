<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JWT Sorare</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#04060e;color:#dce6f4;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#0d1220;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px;width:100%;max-width:460px}
h1{font-size:18px;margin-bottom:6px;color:#00e5ff}
.desc{font-size:12px;color:#4a5a78;margin-bottom:20px;line-height:1.5}
label{display:block;font-size:11px;color:#4a5a78;margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase}
input{width:100%;background:#080c18;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:11px 14px;color:#dce6f4;font-size:14px;outline:none;margin-bottom:14px;transition:border .2s}
input:focus{border-color:#00e5ff}
input.otp{font-size:22px;letter-spacing:8px;text-align:center;font-weight:700;border-color:rgba(240,180,41,.4)}
.btn{width:100%;padding:12px;border-radius:9px;background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.4);color:#00e5ff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;transition:all .2s}
.btn:hover{background:rgba(0,229,255,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.log{margin-top:12px;background:#080c18;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:10px;font-size:10px;font-family:monospace;color:#4a5a78;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto}
.ok{color:#00d68f}.err{color:#f56565}.info{color:#00e5ff}.warn{color:#f0b429}
.section{display:none;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)}
.section.on{display:block}
textarea{width:100%;background:#080c18;border:1px solid rgba(0,214,143,.3);border-radius:8px;padding:10px;color:#00d68f;font-size:9px;font-family:monospace;resize:none;height:80px;outline:none;word-break:break-all}
.copy{width:100%;padding:10px;border-radius:8px;background:rgba(0,214,143,.12);border:1px solid rgba(0,214,143,.3);color:#00d68f;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <h1>🔑 JWT Sorare</h1>
  <p class="desc">Connexion avec support 2FA.</p>

  <div id="s1">
    <label>Email Sorare</label>
    <input type="email" id="em" placeholder="ton@email.com" autocomplete="email">
    <label>Mot de passe</label>
    <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="b1" onclick="step1()">🔗 Connexion</button>
  </div>

  <div id="s2" class="section">
    <label style="color:#f0b429">📱 Code 2FA (6 chiffres)</label>
    <input type="tel" id="otp" class="otp" placeholder="000000" maxlength="6">
    <button class="btn" id="b2" onclick="step2()" style="border-color:rgba(240,180,41,.4);color:#f0b429">✅ Valider le code</button>
  </div>

  <div class="log" id="log">Prêt.</div>

  <div id="s3" class="section">
    <label style="color:#00d68f;display:block;margin-bottom:6px">✅ JWT Token</label>
    <textarea id="jwt" readonly></textarea>
    <button class="copy" onclick="doCopy()">📋 Copier</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
<script>
var logEl = document.getElementById('log');
var _challenge = null;

function L(msg, c){ var d=document.createElement('div'); d.className=c||''; d.textContent=msg; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
function CL(){ logEl.innerHTML=''; }

// Fetch via proxy allorigins — retourne le JSON parsé
async function viaProxy(url, opts) {
  // allorigins supporte GET et POST via raw
  var isPost = opts && opts.method === 'POST';
  
  if (!isPost) {
    // GET: utilise /raw
    var r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
    return JSON.parse(await r.text());
  }
  
  // POST: allorigins ne supporte pas POST directement
  // On utilise corsproxy.io qui supporte POST
  var r2 = await fetch('https://corsproxy.io/?' + encodeURIComponent(url), opts);
  var text = await r2.text();
  L('  Réponse brute proxy: ' + text.substring(0,150), '');
  return JSON.parse(text);
}

async function step1(){
  var email = document.getElementById('em').value.trim();
  var pwd   = document.getElementById('pw').value;
  if (!email||!pwd){ CL(); L('Email et mot de passe requis','err'); return; }
  document.getElementById('b1').disabled=true;
  document.getElementById('s2').classList.remove('on');
  document.getElementById('s3').classList.remove('on');
  CL();

  try {
    // ── Salt ──
    L('1/3 Salt...','info');
    var saltJson;
    try {
      saltJson = await viaProxy('https://api.sorare.com/api/v1/users/'+encodeURIComponent(email));
    } catch(e) {
      L('  Proxy salt échoué: '+e.message,'err');
      throw new Error('Impossible de récupérer le salt');
    }
    if (!saltJson.salt) throw new Error('Email non trouvé sur Sorare');
    L('  Salt: '+saltJson.salt.substring(0,15)+'... ✓','ok');

    // ── Hash ──
    L('2/3 Hash...','info');
    var hashed = await new Promise(function(res,rej){
      dcodeIO.bcrypt.hash(pwd, saltJson.salt, null, function(e,h){ e?rej(e):res(h); });
    });
    L('  Hash: '+hashed.substring(0,15)+'... ✓','ok');

    // ── SignIn ──
    L('3/3 SignIn...','info');
    var body = JSON.stringify({
      query:'mutation M($i:signInInput!){signIn(input:$i){currentUser{slug}jwtToken(aud:"sorare-iq"){token expiredAt}otpSessionChallenge errors{message}}}',
      variables:{ i:{ email:email, password:hashed } }
    });
    var opts = { method:'POST', headers:{'Content-Type':'application/json'}, body:body };
    
    var gqlData;
    try {
      // Essai direct
      var r = await fetch('https://api.sorare.com/federation/graphql', opts);
      var t = await r.text();
      L('  Direct HTTP '+r.status+': '+t.substring(0,100),'');
      gqlData = JSON.parse(t);
    } catch(e) {
      L('  Direct échoué: '+e.message,'');
      // Via proxy
      try {
        gqlData = await viaProxy('https://api.sorare.com/federation/graphql', opts);
      } catch(e2) {
        throw new Error('SignIn impossible: '+e2.message);
      }
    }

    L('  Réponse complète: '+JSON.stringify(gqlData).substring(0,200),'');

    var r2 = gqlData && gqlData.data && gqlData.data.signIn;
    if (!r2) {
      // Peut-être que la réponse a une structure différente
      if (gqlData.errors) throw new Error(gqlData.errors[0].message||'Erreur GraphQL');
      throw new Error('Structure inattendue: '+JSON.stringify(gqlData).substring(0,100));
    }

    if (r2.errors && r2.errors.length) throw new Error(r2.errors[0].message);

    // 2FA ?
    if (r2.otpSessionChallenge) {
      _challenge = r2.otpSessionChallenge;
      L('  2FA requis ✓ — entre ton code','warn');
      document.getElementById('s2').classList.add('on');
      setTimeout(function(){ document.getElementById('otp').focus(); }, 100);
      return;
    }

    // JWT direct
    if (r2.jwtToken && r2.jwtToken.token) {
      showJWT(r2);
      return;
    }

    throw new Error('Réponse inattendue: '+JSON.stringify(r2).substring(0,150));

  } catch(e) {
    L('❌ '+e.message,'err');
  } finally {
    document.getElementById('b1').disabled=false;
  }
}

async function step2(){
  var code = document.getElementById('otp').value.replace(/\D/g,'');
  if (code.length!==6){ L('Code à 6 chiffres requis','err'); return; }
  if (!_challenge){ L('Challenge manquant — recommence l\'étape 1','err'); return; }
  document.getElementById('b2').disabled=true;
  L('Validation 2FA...','info');

  try {
    var body = JSON.stringify({
      query:'mutation M($i:signInInput!){signIn(input:$i){currentUser{slug}jwtToken(aud:"sorare-iq"){token expiredAt}errors{message}}}',
      variables:{ i:{ otpSessionChallenge:_challenge, otpAttempt:code } }
    });
    var opts = { method:'POST', headers:{'Content-Type':'application/json'}, body:body };

    var gqlData;
    try {
      var r = await fetch('https://api.sorare.com/federation/graphql', opts);
      gqlData = await r.json();
      L('  Direct HTTP '+r.status,'');
    } catch(e) {
      gqlData = await viaProxy('https://api.sorare.com/federation/graphql', opts);
    }

    L('  Réponse: '+JSON.stringify(gqlData).substring(0,150),'');
    var r2 = gqlData && gqlData.data && gqlData.data.signIn;
    if (!r2) throw new Error('Réponse invalide');
    if (r2.errors && r2.errors.length) throw new Error(r2.errors[0].message);
    if (!r2.jwtToken||!r2.jwtToken.token) throw new Error('JWT absent');
    showJWT(r2);

  } catch(e) {
    L('❌ '+e.message,'err');
  } finally {
    document.getElementById('b2').disabled=false;
  }
}

function showJWT(r){
  var exp = new Date(r.jwtToken.expiredAt).toLocaleDateString('fr-FR');
  L('✅ @'+(r.currentUser&&r.currentUser.slug)+' — expire: '+exp,'ok');
  document.getElementById('jwt').value = r.jwtToken.token;
  document.getElementById('s3').classList.add('on');
}

function doCopy(){
  var ta=document.getElementById('jwt'); ta.select();
  try{ document.execCommand('copy'); }catch(e){ navigator.clipboard&&navigator.clipboard.writeText(ta.value); }
  var b=document.querySelector('.copy'); b.textContent='✅ Copié!';
  setTimeout(function(){ b.textContent='📋 Copier'; },2000);
}

document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  if(document.getElementById('s2').classList.contains('on')) step2();
  else step1();
});
</script>
</body>
</html>
