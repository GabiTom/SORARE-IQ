<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Obtenir JWT Sorare</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#04060e;color:#dce6f4;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#0d1220;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px;width:100%;max-width:460px}
h1{font-size:18px;margin-bottom:6px;color:#00e5ff}
p{font-size:12px;color:#4a5a78;margin-bottom:20px;line-height:1.5}
label{display:block;font-size:11px;color:#4a5a78;margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase}
input{width:100%;background:#080c18;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:11px 14px;color:#dce6f4;font-size:14px;outline:none;margin-bottom:14px;transition:border .2s}
input:focus{border-color:#00e5ff}
button{width:100%;padding:12px;border-radius:9px;background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(0,229,255,.08));border:1px solid rgba(0,229,255,.4);color:#00e5ff;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
button:hover{background:rgba(0,229,255,.25)}
button:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:16px;padding:12px;border-radius:8px;font-size:12px;display:none}
.status.ok{background:rgba(0,214,143,.1);border:1px solid rgba(0,214,143,.3);color:#00d68f;display:block}
.status.err{background:rgba(245,101,101,.1);border:1px solid rgba(245,101,101,.3);color:#f56565;display:block}
.status.loading{background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.2);color:#00e5ff;display:block}
.jwt-box{margin-top:14px;display:none}
.jwt-box label{color:#00d68f}
textarea{width:100%;background:#080c18;border:1px solid rgba(0,214,143,.3);border-radius:8px;padding:10px;color:#00d68f;font-size:10px;font-family:monospace;resize:vertical;min-height:80px;outline:none}
.copy-btn{margin-top:8px;width:100%;padding:9px;border-radius:7px;background:rgba(0,214,143,.12);border:1px solid rgba(0,214,143,.3);color:#00d68f;font-size:12px;font-weight:700;cursor:pointer}
.copy-btn:hover{background:rgba(0,214,143,.22)}
.note{margin-top:14px;font-size:10px;color:#2a3548;line-height:1.6;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>🔑 Obtenir ton JWT Sorare</h1>
  <p>Connecte-toi avec ton compte Sorare pour récupérer ton jeton JWT. Ce jeton te permettra d'accéder à l'API.</p>

  <label>Email Sorare</label>
  <input type="email" id="email" placeholder="ton@email.com" autocomplete="email">

  <label>Mot de passe Sorare</label>
  <input type="password" id="password" placeholder="••••••••••" autocomplete="current-password">

  <button id="btn" onclick="getJWT()">🔗 Obtenir mon JWT</button>

  <div class="status" id="status"></div>

  <div class="jwt-box" id="jwt-box">
    <label>✅ Ton JWT Token (valable 1 an)</label>
    <textarea id="jwt-out" readonly></textarea>
    <button class="copy-btn" onclick="copyJWT()">📋 Copier le JWT</button>
  </div>

  <p class="note">🔒 Connexion 100% locale — rien n'est envoyé ailleurs que Sorare.<br>Le mot de passe est haché bcrypt avant envoi.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
<script>
// Proxy pour contourner le CORS — utilise un proxy CORS public
// pour récupérer le salt (lecture seule, aucun risque)
const CORS_PROXY  = 'https://corsproxy.io/?';
const SORARE_SALT = 'https://api.sorare.com/api/v1/users/';
const SORARE_GQL  = 'https://api.sorare.com/federation/graphql';

function setStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

async function getJWT() {
  var email    = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn      = document.getElementById('btn');

  if (!email || !password) {
    setStatus('Remplis email et mot de passe', 'err');
    return;
  }

  btn.disabled = true;
  document.getElementById('jwt-box').style.display = 'none';

  try {
    // Étape 1 : récupérer le salt
    setStatus('Étape 1/3 — Récupération du salt...', 'loading');
    var saltUrl = CORS_PROXY + encodeURIComponent(SORARE_SALT + encodeURIComponent(email));
    var saltRes = await fetch(saltUrl);
    if (!saltRes.ok) throw new Error('Salt introuvable — vérifie ton email');
    var saltData = await saltRes.json();
    if (!saltData.salt) throw new Error('Compte introuvable');

    // Étape 2 : hasher le mot de passe
    setStatus('Étape 2/3 — Hachage bcrypt...', 'loading');
    var hashedPassword = await new Promise(function(resolve, reject) {
      dcodeIO.bcrypt.hash(password, saltData.salt, null, function(err, hash) {
        if (err) reject(err); else resolve(hash);
      });
    });

    // Étape 3 : mutation signIn
    setStatus('Étape 3/3 — Connexion à Sorare...', 'loading');
    var mutation = JSON.stringify({
      query: 'mutation SignIn($input:signInInput!){signIn(input:$input){currentUser{slug}jwtToken(aud:"sorare-iq"){token expiredAt}errors{message}}}',
      variables: { input: { email: email, password: hashedPassword } }
    });

    var gqlUrl = CORS_PROXY + encodeURIComponent(SORARE_GQL);
    var gqlRes = await fetch(gqlUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: mutation
    });
    var gqlData = await gqlRes.json();
    var result  = gqlData && gqlData.data && gqlData.data.signIn;

    if (!result) throw new Error('Réponse API invalide');
    if (result.errors && result.errors.length > 0) throw new Error(result.errors[0].message);
    if (!result.jwtToken || !result.jwtToken.token) throw new Error('JWT non reçu');

    var jwt     = result.jwtToken.token;
    var expires = result.jwtToken.expiredAt;
    var slug    = result.currentUser && result.currentUser.slug;

    setStatus('✅ Connecté en tant que @' + slug + ' — JWT valide jusqu\'au ' + new Date(expires).toLocaleDateString('fr-FR'), 'ok');
    document.getElementById('jwt-out').value = jwt;
    document.getElementById('jwt-box').style.display = 'block';

  } catch(e) {
    setStatus('❌ Erreur : ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function copyJWT() {
  var ta = document.getElementById('jwt-out');
  ta.select();
  document.execCommand('copy');
  var btn = document.querySelector('.copy-btn');
  btn.textContent = '✅ Copié !';
  setTimeout(function(){ btn.textContent = '📋 Copier le JWT'; }, 2000);
}

// Permettre Enter pour lancer
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') getJWT();
});
</script>
</body>
</html>
