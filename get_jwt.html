<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JWT Sorare</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#04060e;color:#dce6f4;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#0d1220;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px;width:100%;max-width:460px}
h1{font-size:18px;margin-bottom:6px;color:#00e5ff}
.desc{font-size:12px;color:#4a5a78;margin-bottom:20px;line-height:1.5}
label{display:block;font-size:11px;color:#4a5a78;margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase}
input{width:100%;background:#080c18;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:11px 14px;color:#dce6f4;font-size:14px;outline:none;margin-bottom:14px;transition:border .2s}
input:focus{border-color:#00e5ff}
input.otp{font-size:22px;letter-spacing:8px;text-align:center;font-weight:700}
.btn{width:100%;padding:12px;border-radius:9px;background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.4);color:#00e5ff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;display:block;text-align:center;transition:all .2s}
.btn:hover{background:rgba(0,229,255,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.log{margin-top:12px;background:#080c18;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:10px;font-size:11px;font-family:monospace;color:#4a5a78;min-height:50px;white-space:pre-wrap;word-break:break-all;max-height:150px;overflow-y:auto}
.ok{color:#00d68f}.err{color:#f56565}.info{color:#00e5ff}.warn{color:#f0b429}
.section{display:none;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)}
.section.visible{display:block}
textarea{width:100%;background:#080c18;border:1px solid rgba(0,214,143,.3);border-radius:8px;padding:10px;color:#00d68f;font-size:9px;font-family:monospace;resize:none;height:80px;outline:none;word-break:break-all}
.copy{width:100%;padding:10px;border-radius:8px;background:rgba(0,214,143,.12);border:1px solid rgba(0,214,143,.3);color:#00d68f;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px}
.otp-label{font-size:13px;color:#f0b429;margin-bottom:8px;display:block}
</style>
</head>
<body>
<div class="card">
  <h1>🔑 JWT Sorare</h1>
  <p class="desc">Connexion avec gestion de la double authentification (2FA).</p>

  <!-- Étape 1 : Email + mdp -->
  <div id="step1">
    <label>Email Sorare</label>
    <input type="email" id="em" placeholder="ton@email.com" autocomplete="email">
    <label>Mot de passe</label>
    <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="btn1" onclick="step1()">🔗 Connexion</button>
  </div>

  <!-- Étape 2 : Code 2FA (affiché si nécessaire) -->
  <div id="step2" class="section">
    <span class="otp-label">📱 Code double authentification reçu sur ton app/email</span>
    <input type="number" id="otp" class="otp" placeholder="000000" maxlength="6" autocomplete="one-time-code">
    <button class="btn" id="btn2" onclick="step2()">✅ Valider le code 2FA</button>
  </div>

  <!-- Log -->
  <div class="log" id="log">En attente...</div>

  <!-- Résultat JWT -->
  <div id="jwt-section" class="section">
    <label style="color:#00d68f;display:block;margin-bottom:6px">✅ JWT Token (valable 1 an)</label>
    <textarea id="jwt" readonly></textarea>
    <button class="copy" onclick="doCopy()">📋 Copier le JWT</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
<script>
var logEl = document.getElementById('log');
var otpChallenge = null; // stocke le challenge 2FA

function addLog(msg, cls) {
  var d = document.createElement('div');
  d.className = cls||'';
  d.textContent = msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog(){ logEl.innerHTML=''; }

// ── Fetch avec proxies en cascade ──
var PROXIES = [
  function(url){ return 'https://api.allorigins.win/get?url='+encodeURIComponent(url); },
  function(url){ return 'https://corsproxy.io/?'+encodeURIComponent(url); },
];

async function fetchProxy(url, opts) {
  // Essai direct d'abord
  try {
    var r = await fetch(url, opts||{});
    var t = await r.text();
    // Vérifier que c'est du JSON Sorare (pas une page d'erreur)
    var j = JSON.parse(t);
    if (j.data !== undefined || j.salt !== undefined || j.errors !== undefined) return j;
  } catch(e){ addLog('  Direct: '+e.message,''); }

  // Proxies
  for (var i=0; i<PROXIES.length; i++) {
    try {
      var pUrl = PROXIES[i](url);
      var pr = await fetch(pUrl, opts);
      var pt = await pr.text();
      var pj = JSON.parse(pt);
      // allorigins wrappe dans .contents
      if (pj.contents) pj = JSON.parse(pj.contents);
      if (pj.data !== undefined || pj.salt !== undefined) return pj;
    } catch(e){ addLog('  Proxy '+i+': '+e.message,''); }
  }
  throw new Error('Toutes les tentatives ont échoué');
}

// ── Étape 1 : salt + signIn ──
async function step1() {
  var email = document.getElementById('em').value.trim();
  var pwd   = document.getElementById('pw').value;
  if (!email||!pwd){ clearLog(); addLog('Remplis email et mot de passe','err'); return; }

  document.getElementById('btn1').disabled = true;
  document.getElementById('jwt-section').classList.remove('visible');
  document.getElementById('step2').classList.remove('visible');
  clearLog();

  try {
    // 1. Salt
    addLog('1/3 Récupération du salt...','info');
    var saltData = await fetchProxy('https://api.sorare.com/api/v1/users/'+encodeURIComponent(email));
    if (!saltData.salt) throw new Error('Email introuvable sur Sorare');
    addLog('   Salt OK ✓','ok');

    // 2. Hash
    addLog('2/3 Hash bcrypt...','info');
    var hashed = await new Promise(function(res,rej){
      dcodeIO.bcrypt.hash(pwd, saltData.salt, null, function(e,h){ e?rej(e):res(h); });
    });
    addLog('   Hash OK ✓','ok');

    // 3. SignIn
    addLog('3/3 Connexion Sorare...','info');
    var body = JSON.stringify({
      query: 'mutation M($i:signInInput!){signIn(input:$i){currentUser{slug}jwtToken(aud:"sorare-iq"){token expiredAt}otpSessionChallenge errors{message}}}',
      variables: { i: { email:email, password:hashed } }
    });
    var res = await fetchProxy('https://api.sorare.com/federation/graphql', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:body
    });

    var r = res && res.data && res.data.signIn;
    if (!r) throw new Error('Réponse invalide: '+JSON.stringify(res).substring(0,100));

    // Erreurs
    if (r.errors && r.errors.length) throw new Error(r.errors[0].message||'Erreur inconnue');

    // 2FA requis
    if (r.otpSessionChallenge) {
      otpChallenge = r.otpSessionChallenge;
      addLog('   2FA requis — entre ton code ci-dessous','warn');
      document.getElementById('step2').classList.add('visible');
      document.getElementById('otp').focus();
      return;
    }

    // Succès direct (pas de 2FA)
    if (r.jwtToken && r.jwtToken.token) {
      showJWT(r);
      return;
    }

    throw new Error('Réponse inattendue: '+JSON.stringify(r).substring(0,100));

  } catch(e) {
    addLog('❌ '+e.message,'err');
  } finally {
    document.getElementById('btn1').disabled = false;
  }
}

// ── Étape 2 : validation 2FA ──
async function step2() {
  var code = document.getElementById('otp').value.trim();
  if (!code||code.length<6){ addLog('Entre le code à 6 chiffres','err'); return; }
  if (!otpChallenge){ addLog('Challenge 2FA manquant, recommence','err'); return; }

  document.getElementById('btn2').disabled = true;
  addLog('Validation du code 2FA...','info');

  try {
    var body = JSON.stringify({
      query: 'mutation M($i:signInInput!){signIn(input:$i){currentUser{slug}jwtToken(aud:"sorare-iq"){token expiredAt}errors{message}}}',
      variables: { i: { otpSessionChallenge: otpChallenge, otpAttempt: code } }
    });
    var res = await fetchProxy('https://api.sorare.com/federation/graphql', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:body
    });

    var r = res && res.data && res.data.signIn;
    if (!r) throw new Error('Réponse invalide');
    if (r.errors && r.errors.length) throw new Error(r.errors[0].message||'Code incorrect');
    if (!r.jwtToken || !r.jwtToken.token) throw new Error('JWT absent');

    showJWT(r);

  } catch(e) {
    addLog('❌ '+e.message,'err');
  } finally {
    document.getElementById('btn2').disabled = false;
  }
}

function showJWT(r) {
  var jwt = r.jwtToken.token;
  var exp = new Date(r.jwtToken.expiredAt).toLocaleDateString('fr-FR');
  var slug = r.currentUser && r.currentUser.slug;
  addLog('✅ Connecté : @'+slug+' — expire: '+exp,'ok');
  document.getElementById('jwt').value = jwt;
  document.getElementById('jwt-section').classList.add('visible');
}

function doCopy() {
  var ta = document.getElementById('jwt');
  ta.select();
  try{ document.execCommand('copy'); }
  catch(e){ navigator.clipboard&&navigator.clipboard.writeText(ta.value); }
  var b = document.querySelector('.copy');
  b.textContent='✅ Copié !';
  setTimeout(function(){ b.textContent='📋 Copier le JWT'; },2000);
}

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    if(document.getElementById('step2').classList.contains('visible')) step2();
    else step1();
  }
});
</script>
</body>
</html>
